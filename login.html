<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon/favicon-32x32.png">
    <link rel="manifest" href="./assets/images/favicon/site.webmanifest">
    <title>Login | CYPHR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
    <link rel="stylesheet" href="./assets/CSS/root.css">
    <link rel="stylesheet" href="./assets/CSS/login.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="container is-max-desktop">
                <a id="brand-name" class="navbar-item" href="/">CYPHR</a>
                <input type="checkbox" id="nav-toggle">
                <label for="nav-toggle" class="nav-toggle">
                    <i class="ri-menu-line"></i>
                </label>
                <div class="navbar-menu">
                    <div class="navbar-end">
                        <a class="navbar-item nav-link" href="dashboard.html">My Keys</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="section login-section">
            <div class="container is-max-desktop">
                <div class="login-content">

                    <a href="/" class="back-link">
                        <i class="ri-arrow-left-line"></i>
                        Back to Home
                    </a>

                    <div class="login-heading">
                        <span>WELCOME BACK</span>
                        <h1>Access your<br><em>vault.</em></h1>
                        <p>Access your encrypted vault and get back to building.</p>
                    </div>

                    <div class="auth-options">
                        <button class="button auth-button" id="githubSignIn" type="button">
                            <i class="ri-github-fill"></i>
                            <span>Continue with GitHub</span>
                        </button>
                    </div>

                    <p class="terms">
                        By signing in, you agree to our terms of service and privacy policy.
                    </p>

                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container is-max-desktop">
            <div class="footer-main">
                <div>
                    <strong>CYPHR</strong>
                    <span>Simple API key storage.</span>
                </div>

                <div class="tech-stack">
                    <span>Built with</span>
                    <i class="ri-nodejs-fill" title="Node.js"></i>
                    <i class="devicon-cloudflare-plain colored" title="Cloudflare"></i>
                    <img src="https://hono.dev/images/logo.png" class="tech-stack-img" alt="Hono" title="Hono">
                    <i class="devicon-supabase-plain colored" title="Supabase"></i>
                    <img src="https://neon.tech/brand/neon-logomark-dark-color.svg" class="tech-stack-img" alt="Neon"
                        title="Neon">
                </div>
            </div>

            <div class="footer-meta">
                <div>
                    <span><i class="ri-shield-check-line"></i> AES-256-GCM</span>
                    <span><i class="ri-git-repository-line"></i> Open source</span>
                    <span><i class="ri-global-line"></i> Edge-ready</span>
                </div>

                <span>© 2026 CYPHR. All rights reserved.</span>
            </div>
        </div>
    </footer>

    <script src="./assets/JS/script.js" type="module"></script>
    <script src="./assets/JS/login.js" type="module" defer></script>
</body>

</html>
