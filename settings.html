<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/images/favicon/favicon-16x16.png">
    <link rel="manifest" href="./assets/images/favicon/site.webmanifest">
    <title>Settings | Cyphr</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
    <link rel="stylesheet" href="./assets/CSS/root.css">
    <link rel="stylesheet" href="./assets/CSS/modal.css">
    <link rel="stylesheet" href="./assets/CSS/settings.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="container is-max-desktop">
                <a id="brand-name" class="navbar-item" href="/">CYPHR</a>
                <input type="checkbox" id="nav-toggle">
                <label for="nav-toggle" class="nav-toggle">
                    <i class="ri-menu-line"></i>
                </label>
                <div class="navbar-menu">
                    <div class="navbar-end">
                        <a class="navbar-item nav-link" href="/">Home</a>
                        <a class="navbar-item nav-link" href="dashboard.html">Dashboard</a>
                        <a id="navLogoutBtn" class="nav-link nav-button">Logout</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="section settings-page">
            <div class="container is-max-desktop">
                <div class="settings-header">
                    <span class="settings-eyebrow">ACCOUNT</span>
                    <h1>Settings</h1>
                    <p>Manage your account and security preferences.</p>
                </div>

                <div class="settings-section">
                    <h2 class="settings-title">Account</h2>
                    <div class="settings-card">
                        <div class="settings-row">
                            <span>Email</span>
                            <span id="email-span" class="settings-value">Loading...</span>
                        </div>
                        <div class="settings-row">
                            <span>Name</span>
                            <span id="name-span" class="settings-value">Loading...</span>
                        </div>
                        <div class="settings-row">
                            <span>Account Created</span>
                            <span id="created-at-span" class="settings-value">Loading...</span>
                        </div>
                    </div>
                </div>

                <div class="settings-section">
                    <h2 class="settings-title">Security</h2>
                    <div class="settings-card">
                        <div class="settings-row action-row">
                            <div>
                                <span>Logout</span>
                                <p>Sign out of your Cyphr account.</p>
                            </div>
                            <button id="settingsLogoutBtn" class="button settings-btn-base settings-button">
                                Logout
                                <i class="ri-logout-box-r-line r-icon"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="settings-section danger-zone">
                    <h2 class="settings-title danger-title">Danger Zone</h2>
                    <div class="settings-card">
                        <div class="settings-row action-row">
                            <div>
                                <span>Delete Account</span>
                                <p>Permanently delete your account and stored keys.</p>
                            </div>
                            <button id="deleteAccountBtn" class="button settings-btn-base danger-btn">
                                Delete
                                <i class="ri-delete-bin-6-line r-icon"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="./assets/JS/script.js" type="module"></script>
    <script src="./assets/JS/navbar.js" type="module" defer></script>
    <script src="./assets/JS/footer.js" type="module" defer></script>
    <script src="./assets/JS/alert_modal.js" type="module" defer></script>
    <script src="./assets/JS/settings.js" type="module" defer></script>
</body>

</html>
